[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-vision"
version = "0.1.0"
description = "Classical computer vision algorithms implemented from scratch with NumPy, with runnable examples and tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=9.0"]
viz = ["pillow>=9.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["cv_examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
